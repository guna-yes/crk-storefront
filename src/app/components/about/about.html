<section class="about">
  <div class="about-inner">
    <h2 appReveal>Who we are</h2>
    <p class="lead" appReveal>
      CRK Furnitures is a local furniture workshop. We build sofas, dining tables, beds and
      wardrobes in solid wood, and make custom pieces to your exact requirement.
    </p>
    <div class="photos" appReveal>
      <img class="big" src="about/workshop.jpg" alt="A craftsman planing wood in the workshop" loading="lazy" />
      <img src="about/craftsman.jpg" alt="Marking and shaping a wooden board" loading="lazy" />
      <img src="about/cutting.jpg" alt="Cutting timber to size" loading="lazy" />
    </div>
    <div class="points">
      @for (point of points; track point.title) {
        <div class="point" appReveal>
          <h3>{{ point.title }}</h3>
          <p>{{ point.text }}</p>
        </div>
      }
    </div>
    <a class="btn btn-primary" [href]="whatsappUrl" target="_blank" rel="noopener" appReveal>
      Talk to us on WhatsApp
    </a>
  </div>
</section>
