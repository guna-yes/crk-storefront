<button type="button" class="product-card" appReveal (click)="open.emit(product().id)">
  <span
    class="thumb"
    [style.background]="
      photo
        ? null
        : 'linear-gradient(150deg, ' + product().color + 'e6, ' + product().color + '99)'
    "
  >
    @if (photo; as src) {
      <img [src]="src" [alt]="product().name" class="thumb-photo" />
    } @else {
      <span class="thumb-icon">
        <app-icon [name]="categoryIcon" [size]="26" />
      </span>
    }
    @if (product().featured) {
      <span class="featured-tag">Featured</span>
    }
  </span>

  <span class="card-body">
    <span class="name-row">
      <span class="swatch" [style.background]="product().color"></span>
      <span class="name">{{ product().name }}</span>
    </span>
    <span class="meta">
      {{ product().category }}
      @if (product().wood) {
        &middot; {{ product().wood }}
      }
    </span>
    <span class="card-price">{{ formatPrice(product().price) }}</span>
  </span>
</button>
