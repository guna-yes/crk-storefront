<section id="our-work" class="our-work">
  <div class="head" appReveal>
    <div>
      <h2>Our work</h2>
      <p>Tap any photo or video to open it. Zoom in and turn photos around.</p>
    </div>
    @if (items().length > 1) {
      <div class="arrows">
        <button type="button" (click)="scrollBy(-1)" aria-label="Scroll left">
          <app-icon name="chevron-left" [size]="20" />
        </button>
        <button type="button" (click)="scrollBy(1)" aria-label="Scroll right">
          <app-icon name="chevron-right" [size]="20" />
        </button>
      </div>
    }
  </div>

  <div
    class="track"
    #track
    (pointerdown)="userActive()"
    (pointerenter)="userActive()"
    (wheel)="userActive()"
    (touchmove)="userActive()"
  >
    @for (item of items(); track item.id; let i = $index) {
      <button type="button" class="shot" (click)="open(i)" [attr.aria-label]="'Open photo ' + (i + 1)">
        @if (item.mediaType === 'video') {
          <video [src]="media(item) + '#t=0.1'" preload="metadata" muted playsinline></video>
          <span class="play" aria-hidden="true">&#9654;</span>
        } @else {
          <img [src]="photo(item)" [alt]="item.title || 'Our work'" loading="lazy" />
        }
      </button>
    } @empty {
      <p class="empty">{{ loaded() ? 'Photos coming soon.' : 'Loading…' }}</p>
    }
  </div>
</section>

@if (viewing() !== null) {
  <app-lightbox [images]="images()" [start]="viewing()!" (closed)="viewing.set(null)" />
}
