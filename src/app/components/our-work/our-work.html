<section id="our-work" class="our-work">
  <div class="head" appReveal>
    <h2>Our work</h2>
    <p>A few pieces from our workshop and customers' homes.</p>
  </div>

  <div class="grid">
    @for (item of items(); track item.id) {
      <figure class="card" appReveal>
        <img [src]="photo(item)" [alt]="item.title || 'Our work'" loading="lazy" />
        @if (item.title || item.caption) {
          <figcaption>
            @if (item.title) {
              <strong>{{ item.title }}</strong>
            }
            @if (item.caption) {
              <span>{{ item.caption }}</span>
            }
          </figcaption>
        }
      </figure>
    } @empty {
      <p class="empty">{{ loaded() ? 'Photos coming soon.' : 'Loading…' }}</p>
    }
  </div>
</section>
