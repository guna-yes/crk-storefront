<section id="our-work" class="our-work">
  <div class="head" appReveal>
    <h2>Our work</h2>
    <p>A few pieces from our workshop and customers' homes.</p>
  </div>

  <div
    class="track"
    #track
    (pointerdown)="userActive()"
    (pointerenter)="userActive()"
    (wheel)="userActive()"
    (touchmove)="userActive()"
  >
    @for (item of items(); track item.id) {
      <img class="shot" [src]="photo(item)" [alt]="item.title || 'Our work'" loading="lazy" />
    } @empty {
      <p class="empty">{{ loaded() ? 'Photos coming soon.' : 'Loading…' }}</p>
    }
  </div>
</section>
